name: Feature request
description: Propose a capability the tool does not have
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: a new naming vocabulary or combination catalogue is a **plugin**, not a
        feature. See CONTRIBUTING.md.

        Multi-user operation, cloud sync, live
        building-automation integration and editing the naming standard inside the app are
        deliberately out of scope.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to accomplish, and what makes it hard today?
    validations: { required: true }

  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
    validations: { required: true }

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Existing filter, assignment or export features you attempted, and why they fell short.
