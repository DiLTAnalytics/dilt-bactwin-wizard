<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DiLT Analytics">
  <title>DiLT Analytics</title>
  <g fill="none" stroke="#5FC49C" stroke-width="16">
    <!-- lower left: square -->
